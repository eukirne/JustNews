services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5}
      DATABASE_URL: sqlite:////data/brightside.db
      STORIES_PER_REFRESH: ${STORIES_PER_REFRESH:-15}
      REFRESH_INTERVAL_MINUTES: ${REFRESH_INTERVAL_MINUTES:-45}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - brightside-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  brightside-data:
